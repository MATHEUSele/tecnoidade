name: CI/CD & Security Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # 1. Pipeline de Segurança (Roda primeiro)
  security-scans:
    name: 🛡️ Verificações de Segurança
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ferramentas de segurança
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Verificar vulnerabilidades nas bibliotecas (pip-audit)
        run: |
          # O pip-audit verifica se alguma biblioteca no requirements tem falhas conhecidas de segurança (CVEs)
          pip-audit -r requirements.txt

      - name: Análise estática de segurança no código (Bandit)
        run: |
          # O Bandit vasculha o código Python buscando senhas expostas, injeções de SQL ou configurações frágeis
          # Filtramos para mostrar apenas alertas de severidade média ou alta (-ll)
          bandit -r . -ll -x tests,venv

      - name: Checagem de portas e IPs hardcoded
        run: |
          # Como o banco vai rodar exposto, garantimos que credenciais ou IPs perigosos não estejam no código limpo
          ! grep -r -E "password.*=.*['\"].+['\"]" --include=\*.py . || echo "Atenção: Possível senha exposta no código"

  # 2. Pipeline de Qualidade e Testes (Roda depois da segurança, ou em paralelo dependendo da configuração)
  lint-and-tests:
    name: 🧪 Qualidade e Testes
    runs-on: ubuntu-latest
    needs: security-scans # Só executa se passar no teste de segurança
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install pytest flake8

      - name: Verificação de Qualidade de Código (Lint - Flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Testes de Front-end (Smoke Test - Pytest)
        run: |
          pytest tests/
