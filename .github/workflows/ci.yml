name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Repositório
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Instalar Dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest flake8

    - name: Verificação da Estrutura do Código (Lint)
      run: |
        # O Flake8 vai checar se o código Python tem erros de sintaxe graves ou formatação muito errada
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        
    - name: Verificação do Front-end (Smoke Test)
      run: |
        # O Pytest vai rodar nossos testes para garantir que as telas estão subindo
        pytest tests/
