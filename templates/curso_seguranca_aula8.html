<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TecnoIdade - O que fazer se for hackeado</title>
    <style>
        :root {
            --primary-blue: #1A368F;
            --text-dark: #000000;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #e5e5e5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .mobile-container { width: 100%; max-width: 414px; height: 896px; background-color: #E8F1FC; padding: 20px; overflow-y: auto; border: 4px solid #333; border-radius: 40px; display: flex; flex-direction: column; }
        .header { display: flex; align-items: center; margin-top: 30px; margin-bottom: 20px; }
        .btn-back { width: 40px; height: 40px; background: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; text-decoration: none; color: #333; font-weight: bold; font-size: 20px; }
        h1 { flex-grow: 1; text-align: center; color: var(--primary-blue); font-size: 22px; margin-right: 40px; }
        .content { flex-grow: 1; background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h2 { font-size: 20px; color: var(--text-dark); margin-bottom: 15px; }
        .video-placeholder { width: 100%; height: 200px; background: #ddd; border-radius: 12px; display: flex; justify-content: center; align-items: center; margin-bottom: 20px; font-weight: bold; color: #888; }
        p { font-size: 14px; color: #555; line-height: 1.5; margin-bottom: 20px; }
        .btn-primary { display: block; width: 100%; padding: 15px; background: var(--primary-blue); color: white; text-align: center; border-radius: 15px; text-decoration: none; font-weight: bold; margin-top: auto; }
    </style>
</head>
<body>
    <div class="mobile-container">
        <div class="header">
            <a href="{{ url_for('aprender') }}" class="btn-back"><</a>
            <h1>Segurança Digital</h1>
        </div>
        <div class="content">
            <h2>O que fazer se for hackeado</h2>
                        <div class="video-container" style="width: 100%; border-radius: 15px; overflow: hidden; position: relative; margin-bottom: 15px; background-color: #000; aspect-ratio: 16/9;">
                <img src="{{ url_for('static', filename='images/seguranca_thumbnail.png') }}" alt="Video thumbnail" style="width: 100%; height: 100%; object-fit: cover; opacity: 0.8;">
                <div class="play-overlay" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 50px; height: 50px; background-color: rgba(0,0,0,0.6); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white;">
                    <svg viewBox="0 0 24 24" style="width: 24px; height: 24px; fill: currentColor; margin-left: 3px;">
                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                </div>
                <div class="video-controls" style="position: absolute; bottom: 10px; left: 10px; right: 10px; display: flex; align-items: center; gap: 10px; color: white; font-size: 10px; font-weight: 700;">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="12" height="12"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                    <span>0:00/2:45</span>
                    <div class="video-bar" style="flex-grow: 1; height: 4px; background-color: rgba(255,255,255,0.4); border-radius: 2px; position: relative;">
                        <div class="video-bar-fill" style="position: absolute; left: 0; top: 0; height: 100%; width: 30%; background-color: #1A368F; border-radius: 2px;"></div>
                    </div>
                </div>
            </div>
            <p>Nesta aula você aprenderá sobre O que fazer se for hackeado. Assista o vídeo ou siga o simulador passo a passo para continuar aprendendo.</p>
            <ul style="margin-left: 20px; margin-bottom: 20px; color: #555; font-size: 14px;">
                <li style="margin-bottom: 5px;">Passo 1: Entendendo o conceito</li>
                <li style="margin-bottom: 5px;">Passo 2: Praticando</li>
                <li style="margin-bottom: 5px;">Passo 3: Conclusão</li>
            </ul>
        </div>
        <a href="{{ url_for('curso_concluido') }}" class="btn-primary">Próxima Aula</a>
    </div>
</body>
</html>
